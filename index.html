<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPYOT.BOT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: monospace, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* FILA DE BALANCE Y BÚSQUEDA */
        .header-action {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid #ffffff;
            background: #000;
            gap: 10px;
        }

        .balance-box {
            border: 1px solid #ffffff;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            background: #000;
            white-space: nowrap;
        }

        .search-container {
            display: flex;
            align-items: center;
            border: 1px solid #ffffff;
            border-radius: 20px;
            padding: 7px 15px;
            background: #000;
            flex: 1;
        }

        .search-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 13px;
            width: 100%;
            outline: none;
            font-family: monospace;
        }

        .search-input::placeholder {
            color: #777777;
        }

        /* CONTENIDO PRINCIPAL */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: none;
        }

        .main-content.active {
            display: block;
        }

        /* GRILLA (INVENTARIO Y TIENDA) */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding-bottom: 20px;
        }

        .card {
            border: 1px solid #ffffff;
            padding: 8px;
            background: #000000;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card-img {
            width: 100%;
            height: 120px;
            border: 1px solid #ffffff;
            background: #111;
            background-size: cover;
            background-position: center;
        }

        .card-text {
            font-size: 11px;
            line-height: 1.4;
        }

        .card-btn {
            border: 1px solid #ffffff;
            background: #000;
            color: #ffffff;
            padding: 6px;
            font-size: 10px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            width: 100%;
            margin-top: 4px;
            font-family: monospace;
        }

        .card-btn:hover {
            background: #ffffff;
            color: #000000;
        }

        /* ALEATORIO (RULETA CENTRADA) */
        .roulette-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 30px;
            text-align: center;
        }

        .wheel-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .roulette-pointer {
            position: absolute;
            top: -15px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 16px solid #ffffff;
            z-index: 10;
        }

        .roulette-wheel {
            width: 190px;
            height: 190px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            transition: transform 3s cubic-bezier(0.15, 0.9, 0.2, 1);
        }

        .roulette-inner-text {
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .btn-action {
            border: 1px solid #ffffff;
            background: #000;
            color: #ffffff;
            padding: 12px 25px;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: 0.2s;
            width: 100%;
            max-width: 260px;
        }

        .btn-action:hover, .btn-action:active {
            background: #ffffff;
            color: #000000;
        }

        /* NAVEGACIÓN INFERIOR */
        .nav-bar {
            display: flex;
            border-top: 1px solid #ffffff;
            background: #000000;
        }

        .nav-btn {
            flex: 1;
            padding: 14px 0;
            text-align: center;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            border-right: 1px solid #ffffff;
            font-family: monospace;
        }

        .nav-btn:last-child {
            border-right: none;
        }

        .nav-btn.active {
            background: #ffffff;
            color: #000000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- FILA DE DINERO Y BÚSQUEDA -->
    <div class="header-action">
        <div class="balance-box" id="user-balance">$150</div>
        <div class="search-container">
            <input type="text" class="search-input" id="search-input" placeholder="BUSCAR PERSONAJES" oninput="filtrarInventario()">
        </div>
    </div>

    <!-- SECCIÓN 1: INVENTARIO -->
    <div id="section-inventario" class="main-content active">
        <div class="grid" id="inventory-grid"></div>
    </div>

    <!-- SECCIÓN 2: ALEATORIO -->
    <div id="section-aleatorio" class="main-content">
        <div class="roulette-container">
            <div class="wheel-wrapper">
                <div class="roulette-pointer"></div>
                <div class="roulette-wheel" id="wheel">
                    <div class="roulette-inner-text">[ GACHA ]</div>
                </div>
            </div>
            <button class="btn-action" id="spin-btn" onclick="girarRuleta()">EJECUTAR TIRADA ($50)</button>
        </div>
    </div>

    <!-- SECCIÓN 3: TIENDA (Muestra los personajes disponibles para comprar) -->
    <div id="section-tienda" class="main-content">
        <div class="grid" id="shop-grid"></div>
    </div>

    <!-- NAVEGACIÓN INFERIOR -->
    <div class="nav-bar">
        <button class="nav-btn active" onclick="cambiarSeccion('inventario', this)">INVENTARIO</button>
        <button class="nav-btn" onclick="cambiarSeccion('aleatorio', this)">ALEATORIO</button>
        <button class="nav-btn" onclick="cambiarSeccion('tienda', this)">TIENDA</button>
    </div>

    <!-- CARGA EL ARCHIVO DE PERSONAJES -->
    <script src="personajes.js"></script>

    <script>
        let saldo = 150;
        let inventarioUsuario = JSON.parse(localStorage.getItem('inventario_usuario')) || [];

        function renderInventario(filtro = "") {
            const grid = document.getElementById('inventory-grid');
            
            if (!inventarioUsuario || inventarioUsuario.length === 0) {
                grid.innerHTML = `<div style="grid-column: span 2; text-align: center; color: #777; padding: 40px; font-size: 12px;">NO TIENES PERSONAJES EN TU INVENTARIO.<br>¡CONSIGUE ALGUNOS EN LA TIENDA O RULETA!</div>`;
                return;
            }

            const filtrados = inventarioUsuario.filter(p => 
                (p.id && p.id.toLowerCase().includes(filtro.toLowerCase())) || 
                (p.categoria && p.categoria.toLowerCase().includes(filtro.toLowerCase())) ||
                (p.rareza && p.rareza.toLowerCase().includes(filtro.toLowerCase()))
            );

            if (filtrados.length === 0) {
                grid.innerHTML = `<div style="grid-column: span 2; text-align: center; color: #777; padding: 30px; font-size: 12px;">SIN RESULTADOS</div>`;
                return;
            }

            grid.innerHTML = filtrados.map(p => `
                <div class="card">
                    <div class="card-img" style="background-image: url('${p.imagen}');"></div>
                    <div class="card-text">
                        ID / ${p.id}<br>
                        RAREZA : ${p.rareza}<br>
                        #${p.categoria}
                    </div>
                </div>
            `).join('');
        }

        function renderTienda() {
            const grid = document.getElementById('shop-grid');

            if (typeof personajesDisponibles === 'undefined' || personajesDisponibles.length === 0) {
                grid.innerHTML = `<div style="grid-column: span 2; text-align: center; color: #777; padding: 40px; font-size: 12px;">NO HAY PERSONAJES EN LA TIENDA</div>`;
                return;
            }

            grid.innerHTML = personajesDisponibles.map((p, index) => `
                <div class="card">
                    <div class="card-img" style="background-image: url('${p.imagen}');"></div>
                    <div class="card-text">
                        ID / ${p.id}<br>
                        RAREZA : ${p.rareza}<br>
                        #${p.categoria}
                    </div>
                    <button class="card-btn" onclick="comprarPersonaje(${index})">COMPRAR ($100)</button>
                </div>
            `).join('');
        }

        function comprarPersonaje(index) {
            const precio = 100;
            if (saldo < precio) {
                alert("Saldo insuficiente.");
                return;
            }

            saldo -= precio;
            document.getElementById('user-balance').innerText = "$" + saldo;

            const personajeComprado = personajesDisponibles[index];
            inventarioUsuario.push(personajeComprado);
            localStorage.setItem('inventario_usuario', JSON.stringify(inventarioUsuario));

            alert(`¡Has comprado a ${personajeComprado.id}! Ya está en tu inventario.`);
        }

        function filtrarInventario() {
            const texto = document.getElementById('search-input').value;
            renderInventario(texto);
        }

        function cambiarSeccion(seccion, elemento) {
            document.querySelectorAll('.main-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

            document.getElementById('section-' + seccion).classList.add('active');
            elemento.classList.add('active');

            if(seccion === 'inventario') {
                renderInventario();
            } else if(seccion === 'tienda') {
                renderTienda();
            }
        }

        let girando = false;
        function girarRuleta() {
            if (girando) return;
            if (saldo < 50) {
                alert("Saldo insuficiente.");
                return;
            }

            if (typeof personajesDisponibles === 'undefined' || personajesDisponibles.length === 0) {
                alert("Error: No se encuentra la lista en personajes.js");
                return;
            }

            saldo -= 50;
            document.getElementById('user-balance').innerText = "$" + saldo;

            girando = true;
            const wheel = document.getElementById('wheel');
            const btn = document.getElementById('spin-btn');
            btn.disabled = true;

            const randomDeg = Math.floor(1800 + Math.random() * 1080);
            wheel.style.transform = `rotate(${randomDeg}deg)`;

            setTimeout(() => {
                girando = false;
                btn.disabled = false;

                const randomIndex = Math.floor(Math.random() * personajesDisponibles.length);
                const personajeObtenido = personajesDisponibles[randomIndex];

                inventarioUsuario.push(personajeObtenido);
                localStorage.setItem('inventario_usuario', JSON.stringify(inventarioUsuario));

                alert(`¡Has obtenido en la ruleta a: ${personajeObtenido.id} (${personajeObtenido.rareza})!`);
            }, 3000);
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderInventario();
            renderTienda();
        });
    </script>
</body>
</html>

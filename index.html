<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Mini App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: monospace, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            border-bottom: 1px solid #ffffff;
            background: #000;
            gap: 10px;
        }

        .balance-box {
            border: 1px solid #ffffff;
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            background: #000;
            white-space: nowrap;
        }

        .search-container {
            display: flex;
            align-items: center;
            border: 1px solid #ffffff;
            border-radius: 20px;
            padding: 6px 12px;
            background: #000;
            flex: 1;
        }

        .search-container span {
            margin-right: 8px;
            font-size: 14px;
        }

        .search-input {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 13px;
            width: 100%;
            outline: none;
            font-family: monospace;
        }

        .search-input::placeholder {
            color: #888888;
        }

        /* CONTENIDO PRINCIPAL */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: none;
        }

        .main-content.active {
            display: block;
        }

        /* INVENTARIO / GRILLA */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding-bottom: 20px;
        }

        .card {
            border: 1px solid #ffffff;
            padding: 8px;
            background: #000000;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card-img {
            width: 100%;
            height: 110px;
            border: 1px solid #ffffff;
            background: #111;
            background-size: cover;
            background-position: center;
        }

        .card-text {
            font-size: 11px;
            line-height: 1.3;
        }

        /* RULETA (ALEATORIO) */
        .roulette-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 25px;
            text-align: center;
        }

        .roulette-wheel {
            width: 200px;
            height: 200px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #000;
            transition: transform 3s cubic-bezier(0.15, 0.9, 0.2, 1);
        }

        .roulette-pointer {
            position: absolute;
            top: -12px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 16px solid #ffffff;
            z-index: 10;
        }

        .roulette-inner-text {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .btn-action {
            border: 1px solid #ffffff;
            background: #000;
            color: #ffffff;
            padding: 12px 25px;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-action:hover, .btn-action:active {
            background: #ffffff;
            color: #000000;
        }

        /* TIENDA */
        .shop-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .shop-item {
            border: 1px solid #ffffff;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000;
        }

        .shop-item small {
            color: #aaaaaa;
            font-size: 10px;
        }

        /* NAVEGACIÓN INFERIOR */
        .nav-bar {
            display: flex;
            border-top: 1px solid #ffffff;
            background: #000000;
        }

        .nav-btn {
            flex: 1;
            padding: 14px 0;
            text-align: center;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            border-right: 1px solid #ffffff;
            font-family: monospace;
        }

        .nav-btn:last-child {
            border-right: none;
        }

        .nav-btn.active {
            background: #ffffff;
            color: #000000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- HEADER GENERAL -->
    <div class="header">
        <div class="balance-box" id="user-balance">⭐ 150</div>
        <div class="search-container">
            <span>🔍</span>
            <input type="text" class="search-input" id="search-input" placeholder="BUSCAR PERSONAJES" oninput="filtrarInventario()">
        </div>
    </div>

    <!-- SECCIÓN 1: INVENTARIO -->
    <div id="section-inventario" class="main-content active">
        <div class="grid" id="inventory-grid">
            <!-- Se carga dinámicamente -->
        </div>
    </div>

    <!-- SECCIÓN 2: ALEATORIO (RULETA) -->
    <div id="section-aleatorio" class="main-content">
        <div class="roulette-container">
            <div class="roulette-pointer"></div>
            <div class="roulette-wheel" id="wheel">
                <div class="roulette-inner-text">[ GACHA ]</div>
            </div>
            <button class="btn-action" id="spin-btn" onclick="girarRuleta()">EJECUTAR TIRADA (50 ⭐)</button>
        </div>
    </div>

    <!-- SECCIÓN 3: TIENDA -->
    <div id="section-tienda" class="main-content">
        <div class="shop-list">
            <div class="shop-item">
                <div>
                    <strong>Pack x100 Créditos</strong><br>
                    <small>Recarga estándar</small>
                </div>
                <button class="btn-action" onclick="comprar(100, 0)">COMPRAR</button>
            </div>
            <div class="shop-item">
                <div>
                    <strong>Cofre Legendario</strong><br>
                    <small>Garantiza SSR</small>
                </div>
                <button class="btn-action" onclick="comprar(0, 1)">COMPRAR</button>
            </div>
        </div>
    </div>

    <!-- NAVEGACIÓN INFERIOR -->
    <div class="nav-bar">
        <button class="nav-btn active" onclick="cambiarSeccion('inventario', this)">Inventario</button>
        <button class="nav-btn" onclick="cambiarSeccion('aleatorio', this)">Aleatorio</button>
        <button class="nav-btn" onclick="cambiarSeccion('tienda', this)">Tienda</button>
    </div>

    <script>
        // BASE DE DATOS DE PERSONAJES (puedes editar aquí tus URLs de imágenes y datos)
        const personajesInventario = [
            {
                id: "CHI-01",
                rareza: "SSR",
                categoria: "TECHWEAR",
                imagen: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&auto=format&fit=crop&q=60"
            },
            {
                id: "KAN-02",
                rareza: "SR",
                categoria: "CYBER",
                imagen: "https://images.unsplash.com/photo-1634017839464-5c339ebe3cb4?w=400&auto=format&fit=crop&q=60"
            },
            {
                id: "CNR-03",
                rareza: "SSR",
                categoria: "ASTRO",
                imagen: "https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=400&auto=format&fit=crop&q=60"
            },
            {
                id: "HEI-04",
                rareza: "R",
                categoria: "TECHWEAR",
                imagen: "https://images.unsplash.com/photo-1614064641938-3bbee52942c7?w=400&auto=format&fit=crop&q=60"
            }
        ];

        let saldo = 150;

        // Renderizar inventario inicial
        function renderInventario(filtro = "") {
            const grid = document.getElementById('inventory-grid');
            const filtrados = personajesInventario.filter(p => 
                p.id.toLowerCase().includes(filtro.toLowerCase()) || 
                p.categoria.toLowerCase().includes(filtro.toLowerCase()) ||
                p.rareza.toLowerCase().includes(filtro.toLowerCase())
            );

            if (filtrados.length === 0) {
                grid.innerHTML = `<div style="grid-column: span 2; text-align: center; color: #777; padding: 20px;">SIN RESULTADOS</div>`;
                return;
            }

            grid.innerHTML = filtrados.map(p => `
                <div class="card">
                    <div class="card-img" style="background-image: url('${p.imagen}');"></div>
                    <div class="card-text">
                        ID / ${p.id}<br>
                        RAREZA : ${p.rareza}<br>
                        #${p.categoria}
                    </div>
                </div>
            `).join('');
        }

        // Filtrar al escribir en la lupa
        function filtrarInventario() {
            const texto = document.getElementById('search-input').value;
            renderInventario(texto);
        }

        // Cambiar entre pestañas inferiores
        function cambiarSeccion(seccion, elemento) {
            document.querySelectorAll('.main-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

            document.getElementById('section-' + seccion).classList.add('active');
            elemento.classList.add('active');
        }

        // Lógica de la Ruleta Animada
        let girando = false;
        function girarRuleta() {
            if (girando) return;
            if (saldo < 50) {
                alert("Saldo insuficiente para tirar.");
                return;
            }

            saldo -= 50;
            document.getElementById('user-balance').innerText = "⭐ " + saldo;

            girando = true;
            const wheel = document.getElementById('wheel');
            const btn = document.getElementById('spin-btn');
            btn.disabled = true;

            // Generar giros aleatorios múltiples vueltas (ej. 5 vueltas completas + grados extra)
            const randomDeg = Math.floor(1800 + Math.random() * 1080);
            wheel.style.transform = `rotate(${randomDeg}deg)`;

            setTimeout(() => {
                girando = false;
                btn.disabled = false;
                alert("¡Tirada exitosa! Revisa tu inventario.");
            }, 3000);
        }

        // Lógica de Tienda
        function comprar(creditos, cofre) {
            if (creditos > 0) {
                saldo += creditos;
                document.getElementById('user-balance').innerText = "⭐ " + saldo;
                alert(`¡Has comprado ${creditos} créditos con éxito!`);
            } else {
                alert("¡Cofre adquirido! Se ha añadido a tus recompensas.");
            }
        }

        // Inicializar al cargar
        window.addEventListener('DOMContentLoaded', () => {
            renderInventario();
        });
    </script>
</body>
</html>

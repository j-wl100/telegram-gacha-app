<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPYOT.BOT</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: monospace, sans-serif; }
        body { background-color: #000; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header-action { display: flex; align-items: center; padding: 10px 15px; border-bottom: 1px solid #fff; background: #000; gap: 10px; }
        .balance-box { border: 1px solid #fff; padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; background: #000; white-space: nowrap; }
        .search-container { display: flex; align-items: center; border: 1px solid #fff; border-radius: 20px; padding: 7px 15px; background: #000; flex: 1; }
        .search-input { background: transparent; border: none; color: #fff; font-size: 13px; width: 100%; outline: none; font-family: monospace; }
        .search-input::placeholder { color: #777; }
        .main-content { flex: 1; overflow-y: auto; padding: 15px; display: none; }
        .main-content.active { display: block; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: 20px; }
        .card { border: 1px solid #fff; padding: 8px; background: #000; display: flex; flex-direction: column; gap: 6px; }
        .card-img { width: 100%; height: 120px; border: 1px solid #fff; background: #111; background-size: cover; background-position: center; }
        .card-text { font-size: 11px; line-height: 1.4; }
        .roulette-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 30px; text-align: center; }
        .wheel-wrapper { position: relative; display: flex; justify-content: center; align-items: center; }
        .roulette-pointer { position: absolute; top: -15px; width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 16px solid #fff; z-index: 10; }
        .roulette-wheel { width: 190px; height: 190px; border: 2px solid #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #000; transition: transform 3s cubic-bezier(0.15, 0.9, 0.2, 1); }
        .roulette-inner-text { font-size: 13px; font-weight: bold; letter-spacing: 1px; }
        .btn-action { border: 1px solid #fff; background: #000; color: #fff; padding: 12px 25px; font-size: 12px; cursor: pointer; text-transform: uppercase; font-weight: bold; width: 100%; max-width: 260px; }
        .btn-action:hover { background: #fff; color: #000; }
        .shop-list { display: flex; flex-direction: column; gap: 12px; padding-bottom: 20px; }
        .shop-item { border: 1px solid #fff; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; background: #000; }
        .shop-item small { color: #888; font-size: 10px; }
        .shop-btn { border: 1px solid #fff; background: #000; color: #fff; padding: 8px 15px; font-size: 11px; cursor: pointer; font-weight: bold; font-family: monospace; white-space: nowrap; }
        .shop-btn:hover { background: #fff; color: #000; }
        .nav-bar { display: flex; border-top: 1px solid #fff; background: #000; }
        .nav-btn { flex: 1; padding: 14px 0; text-align: center; background: none; border: none; color: #fff; font-size: 11px; cursor: pointer; text-transform: uppercase; border-right: 1px solid #fff; font-family: monospace; }
        .nav-btn:last-child { border-right: none; }
        .nav-btn.active { background: #fff; color: #000; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-action">
        <div class="balance-box" id="user-balance">$150</div>
        <div class="search-container">
            <input type="text" class="search-input" id="search-input" placeholder="BUSCAR PERSONAJES" oninput="filtrarInventario()">
        </div>
    </div>

    <!-- INVENTARIO -->
    <div id="section-inventario" class="main-content active">
        <div class="grid" id="inventory-grid"></div>
    </div>

    <!-- ALEATORIO (RULETA) -->
    <div id="section-aleatorio" class="main-content">
        <div class="roulette-container">
            <div class="wheel-wrapper">
                <div class="roulette-pointer"></div>
                <div class="roulette-wheel" id="wheel">
                    <div class="roulette-inner-text">[ GACHA ]</div>
                </div>
            </div>
            <button class="btn-action" id="spin-btn" onclick="girarRuleta()">EJECUTAR TIRADA ($50)</button>
        </div>
    </div>

    <!-- TIENDA -->
    <div id="section-tienda" class="main-content">
        <div class="shop-list" id="shop-container">
            <div class="shop-item">
                <div>
                    <strong>Pack x100 Créditos</strong><br>
                    <small>Recarga estándar</small>
                </div>
                <button class="shop-btn" onclick="comprarCreditos(100)">COMPRAR</button>
            </div>
            <!-- Los personajes se cargarán aquí automáticamente con el mismo formato -->
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-btn active" onclick="cambiarSeccion('inventario', this)">INVENTARIO</button>
        <button class="nav-btn" onclick="cambiarSeccion('aleatorio', this)">ALEATORIO</button>
        <button class="nav-btn" onclick="cambiarSeccion('tienda', this)">TIENDA</button>
    </div>

    <script>
        const currentUserId = "usuario_prueba_1"; 
        let saldo = 150;
        let inventarioUsuario = [];
        let listaPersonajesGlobal = [];

        async function inicializarApp() {
            try {
                const resUser = await fetch(`/api/usuario/${currentUserId}`);
                const dataUser = await resUser.json();
                saldo = dataUser.saldo ?? 150;
                inventarioUsuario = dataUser.inventario || [];
                document.getElementById('user-balance').innerText = "$" + saldo;
                renderInventario();

                const resP = await fetch('/personajes.json');
                listaPersonajesGlobal = await resP.json();
                cargarTiendaPersonajes();
            } catch (e) {
                console.error("Error al inicializar:", e);
            }
        }

        // Lupa / Buscador en tiempo real
        function filtrarInventario() {
            const texto = document.getElementById('search-input').value.toLowerCase();
            const grid = document.getElementById('inventory-grid');

            const filtrados = inventarioUsuario.filter(p => 
                p.id.toLowerCase().includes(texto) || 
                p.categoria.toLowerCase().includes(texto) || 
                p.rareza.toLowerCase().includes(texto)
            );

            if (filtrados.length === 0) {
                grid.innerHTML = `<div style="grid-column: span 2; text-align: center; color: #777; padding: 30px; font-size: 12px;">SIN RESULTADOS</div>`;
                return;
            }

            grid.innerHTML = filtrados.map(p => `
                <div class="card">
                    <div class="card-img" style="background-image: url('${p.imagen}');"></div>
                    <div class="card-text">
                        ID / ${p.id}<br>
                        RAREZA : ${p.rareza}<br>
                        #${p.categoria}
                    </div>
                </div>
            `).join('');
        }

        function renderInventario() {
            filtrarInventario();
        }

        function cambiarSeccion(seccion, elemento) {
            document.querySelectorAll('.main-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('section-' + seccion).classList.add('active');
            elemento.classList.add('active');
            if(seccion === 'inventario') renderInventario();
        }

        let girando = false;
        async function girarRuleta() {
            if (girando) return;
            if (saldo < 50) {
                alert("Saldo insuficiente.");
                return;
            }

            girando = true;
            const wheel = document.getElementById('wheel');
            const btn = document.getElementById('spin-btn');
            btn.disabled = true;

            const randomDeg = Math.floor(1800 + Math.random() * 1080);
            wheel.style.transform = `rotate(${randomDeg}deg)`;

            try {
                const res = await fetch('/api/ruleta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUserId })
                });
                const data = await res.json();

                setTimeout(() => {
                    girando = false;
                    btn.disabled = false;
                    if (data.success) {
                        saldo = data.nuevoSaldo;
                        inventarioUsuario.push(data.personaje);
                        document.getElementById('user-balance').innerText = "$" + saldo;
                        alert(`¡Has obtenido a: ${data.personaje.id} (${data.personaje.rareza})!`);
                        renderInventario();
                    } else {
                        alert(data.error || "Error al girar");
                    }
                }, 3000);
            } catch (err) {
                girando = false;
                btn.disabled = false;
                alert("Error de conexión con el servidor.");
            }
        }

        function cargarTiendaPersonajes() {
            const shopContainer = document.getElementById('shop-container');
            listaPersonajesGlobal.forEach((personaje, index) => {
                shopContainer.innerHTML += `
                    <div class="shop-item">
                        <div>
                            <strong>${personaje.id}</strong><br>
                            <small>Rareza: ${personaje.rareza} | #${personaje.categoria}</small>
                        </div>
                        <button class="shop-btn" onclick="comprarPersonajeDirecto(${index})">COMPRAR ($150)</button>
                    </div>
                `;
            });
        }

        async function comprarPersonajeDirecto(index) {
            if (saldo < 150) {
                alert("Saldo insuficiente.");
                return;
            }

            try {
                const res = await fetch('/api/comprar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: currentUserId, personajeIndex: index })
                });
                const data = await res.json();

                if (data.success) {
                    saldo = data.nuevoSaldo;
                    inventarioUsuario.push(data.personaje);
                    document.getElementById('user-balance').innerText = "$" + saldo;
                    alert(`¡Has comprado a ${data.personaje.id}! Ya está en tu inventario.`);
                    renderInventario();
                } else {
                    alert(data.error || "Error en la compra");
                }
            } catch (err) {
                alert("Error de conexión con el servidor.");
            }
        }

        function comprarCreditos(cantidad) {
            saldo += cantidad;
            document.getElementById('user-balance').innerText = "$" + saldo;
            alert(`¡Has recargado ${cantidad} créditos!`);
        }

        window.addEventListener('DOMContentLoaded', inicializarApp);
    </script>
</body>
</html>

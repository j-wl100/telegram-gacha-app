<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPYOT.BOT SYSTEM</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: monospace, sans-serif; }
        body { background-color: #000; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* PANTALLA DE REGISTRO */
        #modal-registro { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .registro-box { border: 1px solid #fff; padding: 20px; width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; background: #050505; }
        .registro-box input { background: #000; border: 1px solid #fff; color: #fff; padding: 10px; font-family: monospace; font-size: 12px; outline: none; width: 100%; }
        .registro-box button { background: #fff; color: #000; border: none; padding: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; }

        /* HEADER Y LUPA */
        .header-action { display: flex; align-items: center; padding: 10px 15px; border-bottom: 1px solid #fff; background: #000; gap: 10px; }
        .balance-box { border: 1px solid #fff; padding: 8px 12px; border-radius: 20px; font-weight: bold; font-size: 13px; background: #000; white-space: nowrap; }
        .search-container { display: flex; align-items: center; border: 1px solid #fff; border-radius: 20px; padding: 7px 15px; background: #000; flex: 1; }
        .search-input { background: transparent; border: none; color: #fff; font-size: 13px; width: 100%; outline: none; font-family: monospace; }
        .search-input::placeholder { color: #666; }

        .main-content { flex: 1; overflow-y: auto; padding: 15px; display: none; }
        .main-content.active { display: block; }
        
        /* TARJETAS */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-bottom: 20px; }
        .card { border: 1px solid #fff; padding: 8px; background: #000; display: flex; flex-direction: column; gap: 6px; }
        .card-img { width: 100%; height: 110px; border: 1px solid #fff; background: #111; background-size: cover; background-position: center; }
        .card-text { font-size: 10px; line-height: 1.4; }
        .btn-card-action { border: 1px solid #fff; background: #000; color: #fff; padding: 6px; font-size: 10px; cursor: pointer; text-align: center; font-weight: bold; width: 100%; margin-top: 4px; }
        .btn-card-action:hover { background: #fff; color: #000; }

        /* ZONA DE JUEGO */
        .game-zone { display: flex; flex-direction: column; gap: 15px; padding-bottom: 20px; }
        .wheel-container { display: flex; flex-direction: column; align-items: center; border: 1px solid #fff; padding: 15px; gap: 10px; background: #050505; }
        .roulette-wrapper { position: relative; display: flex; justify-content: center; align-items: center; }
        
        .actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-action { border: 1px solid #fff; background: #000; color: #fff; padding: 10px; font-size: 11px; cursor: pointer; text-transform: uppercase; font-weight: bold; text-align: center; }
        .btn-action:hover { background: #fff; color: #000; }

        .console-box { border: 1px dashed #777; background: #050505; padding: 10px; font-size: 11px; min-height: 50px; color: #00ff66; margin-top: 5px; word-break: break-all; }

        .bet-box { border: 1px solid #fff; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: #050505; }
        .bet-box input { background: #000; border: 1px solid #fff; color: #fff; padding: 8px; font-family: monospace; font-size: 11px; outline: none; width: 100%; }

        /* NAVEGACIÓN */
        .nav-bar { display: flex; border-top: 1px solid #fff; background: #000; }
        .nav-btn { flex: 1; padding: 14px 0; text-align: center; background: none; border: none; color: #fff; font-size: 11px; cursor: pointer; text-transform: uppercase; border-right: 1px solid #fff; font-family: monospace; }
        .nav-btn:last-child { border-right: none; }
        .nav-btn.active { background: #fff; color: #000; font-weight: bold; }

        /* PANEL ADMIN (ACTUALIZADO A AZUL CYBER Y BLANCO) */
        .admin-panel { padding: 10px; background: #050505; border: 1px solid #00d2ff; margin-bottom: 15px; }
        .admin-user-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #444; padding: 8px 0; font-size: 11px; }
    </style>
</head>
<body>

    <!-- REGISTRO -->
    <div id="modal-registro">
        <div class="registro-box">
            <h3 style="font-size: 14px; text-align: center;">REGISTRO DE USUARIO</h3>
            <p style="font-size: 10px; color: #888; text-align: center;">Introduce los datos requeridos</p>
            <input type="text" id="reg-telegram" placeholder="User de Telegram (ej: usuario123)">
            <input type="text" id="reg-nombre" placeholder="Nombre que usaste en la ficha de acceso">
            <input type="number" id="reg-edad" placeholder="Edad">
            <button onclick="registrarUsuario()">REGISTRARME</button>
        </div>
    </div>

    <div class="header-action">
        <div class="balance-box" id="user-balance">$100</div>
        <div class="search-container">
            <input type="text" class="search-input" id="search-input" placeholder="BUSCAR PERSONAJES" oninput="procesarBusqueda()">
        </div>
    </div>

    <!-- INVENTARIO -->
    <div id="section-inventario" class="main-content active">
        <div id="admin-container"></div>
        <div class="grid" id="inventory-grid"></div>
    </div>

    <!-- ZONA DE JUEGO -->
    <div id="section-juego" class="main-content">
        <div class="game-zone">
            <div class="wheel-container">
                <span style="font-size: 11px; font-weight: bold;">[ RULETA GACHA DE PERSONAJES ]</span>
                <div class="roulette-wrapper">
                    <canvas id="wheel" width="130" height="130" style="border: 2px solid #fff; border-radius: 50%; background: #000; transition: transform 3s cubic-bezier(0.15, 0.9, 0.2, 1);"></canvas>
                </div>
                <button class="btn-action" style="width: 100%;" onclick="girarRuleta()">GIRAR RULETA (-30 CRÉDITOS)</button>
            </div>

            <div class="actions-grid">
                <button class="btn-action" onclick="reclamarDiario()">RECLAMAR DIARIO (+$100)</button>
                <button class="btn-action" onclick="minarCreditos()">MINAR / TRABAJAR (+$50)</button>
                <button class="btn-action" onclick="ejecutarCrimen()" style="grid-column: span 2;">COMETER CRIMEN (RIESGO)</button>
            </div>

            <div class="bet-box">
                <span style="font-size: 11px; font-weight: bold;">[ APUESTA RÁPIDA (50 / 50) ]</span>
                <input type="number" id="bet-amount" placeholder="Cantidad a apostar...">
                <button class="btn-action" onclick="apostarCreditos()">APOSTAR CRÉDITOS</button>
            </div>

            <div class="console-box" id="console-output">
                > Sistema de economía listo. Selecciona una acción.
            </div>
        </div>
    </div>

    <!-- TIENDA -->
    <div id="section-tienda" class="main-content">
        <div class="grid" id="shop-grid"></div>
    </div>

    <div class="nav-bar">
        <button class="nav-btn active" onclick="cambiarSeccion('inventario', this)">INVENTARIO</button>
        <button class="nav-btn" onclick="cambiarSeccion('juego', this)">ZONA DE JUEGO</button>
        <button class="nav-btn" onclick="cambiarSeccion('tienda', this)">TIENDA</button>
    </div>

    <script>
        const PASSWORD_ADMIN = "J";
        let usuarioActual = localStorage.getItem("telegramUser") || null;
        let datosUsuario = {};
        let listaPersonajesGlobal = [];

        async function inicializar() {
            if (!usuarioActual) {
                document.getElementById('modal-registro').style.display = 'flex';
                return;
            }
            document.getElementById('modal-registro').style.display = 'none';

            try {
                const res = await fetch(`/api/usuario/${usuarioActual}`);
                const data = await res.json();
                if (data.error) {
                    localStorage.removeItem("telegramUser");
                    location.reload();
                    return;
                }
                datosUsuario = data;
                document.getElementById('user-balance').innerText = "$" + datosUsuario.saldo;

                const resP = await fetch('/personajes.json');
                listaPersonajesGlobal = await resP.json();

                renderInventario();
                renderTienda();

                const nombresRuleta = listaPersonajesGlobal.slice(0, 6).map(p => p.id);
                if(nombresRuleta.length > 0) dibujarRuletaCanvas(nombresRuleta);

            } catch (e) {
                console.error("Error al conectar con el servidor", e);
            }
        }

        async function registrarUsuario() {
            const telegramUser = document.getElementById('reg-telegram').value.trim().replace('@','');
            const nombre = document.getElementById('reg-nombre').value.trim();
            const edad = document.getElementById('reg-edad').value.trim();

            if (!telegramUser || !nombre || !edad) {
                alert("Completa todos los campos obligatorios.");
                return;
            }

            try {
                const res = await fetch('/api/registrar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramUser, nombre, edad })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem("telegramUser", telegramUser);
                    location.reload();
                } else {
                    alert(data.error || "Error al registrarse.");
                }
            } catch (err) {
                alert("Error de conexión con el servidor.");
            }
        }

        function cambiarSeccion(seccion, elemento) {
            document.querySelectorAll('.main-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('section-' + seccion).classList.add('active');
            elemento.classList.add('active');
        }

        function logConsola(texto, color = "#00ff66") {
            const box = document.getElementById('console-output');
            box.style.color = color;
            box.innerText = "> " + texto;
        }

        async function procesarBusqueda() {
            const texto = document.getElementById('search-input').value.trim();
            const adminContainer = document.getElementById('admin-container');

            if (texto === PASSWORD_ADMIN) {
                adminContainer.innerHTML = `<div class="admin-panel"><strong style="color: #00d2ff;">CARGANDO PANEL ADMIN...</strong></div>`;
                const res = await fetch('/api/admin/usuarios');
                const users = await res.json();
                
                adminContainer.innerHTML = `
                    <div class="admin-panel">
                        <p style="font-weight: bold; margin-bottom: 8px; color: #00d2ff; letter-spacing: 1px;">PANEL DE CONTROL DE USUARIOS</p>
                        ${users.map(u => `
                            <div class="admin-user-row">
                                <span style="color: #fff;">@${u.telegramUser} (${u.nombre}, ${u.edad} años) - $${u.saldo}</span>
                                <button onclick="eliminarUsuario('${u.telegramUser}')" style="background:#000; color:#fff; border:1px solid #fff; padding:4px 8px; cursor:pointer; font-family: monospace;">BORRAR</button>
                            </div>
                        `).join('')}
                    </div>
                `;
                return;
            } else {
                adminContainer.innerHTML = "";
            }

            const grid = document.getElementById('inventory-grid');
            const filtrados = datosUsuario.inventario.filter(p => 
                p.id.toLowerCase().includes(texto.toLowerCase()) || 
                p.categoria.toLowerCase().includes(texto.toLowerCase()) || 
                p.rareza.toLowerCase().includes(texto.toLowerCase())
            );

            if (filtrados.length === 0) {
                grid.innerHTML = `<div style="grid-column: span 2; text-align: center; color: #777; padding: 20px; font-size: 11px;">SIN RESULTADOS EN INVENTARIO</div>`;
                return;
            }

            grid.innerHTML = filtrados.map(p => `
                <div class="card">
                    <div class="card-img" style="background-image: url('${p.imagen}');"></div>
                    <div class="card-text">
                        ID / ${p.id}<br>
                        RAREZA : ${p.rareza}<br>
                        #${p.categoria}
                    </div>
                    <button class="btn-card-action" onclick='enviarATelegram(${JSON.stringify(p)})'>ELEGIR / ENVIAR</button>
                </div>
            `).join('');
        }

        function renderInventario() {
            const grid = document.getElementById('inventory-grid');
            if (!datosUsuario.inventario || datosUsuario.inventario.length === 0) {
                grid.innerHTML = `<div style="grid-column: span 2; text-align: center; color: #777; padding: 30px; font-size: 11px;">INVENTARIO VACÍO</div>`;
                return;
            }

            grid.innerHTML = datosUsuario.inventario.map(p => `
                <div class="card">
                    <div class="card-img" style="background-image: url('${p.imagen}');"></div>
                    <div class="card-text">
                        ID / ${p.id}<br>
                        RAREZA : ${p.rareza}<br>
                        #${p.categoria}
                    </div>
                    <button class="btn-card-action" onclick='enviarATelegram(${JSON.stringify(p)})'>ELEGIR / ENVIAR</button>
                </div>
            `).join('');
        }

        function renderTienda() {
            const shopGrid = document.getElementById('shop-grid');
            const idsInventario = (datosUsuario.inventario || []).map(p => p.id);
            const personajesDisponibles = listaPersonajesGlobal.filter(p => !idsInventario.includes(p.id));

            if (personajesDisponibles.length === 0) {
                shopGrid.innerHTML = `<div style="grid-column: span 2; text-align: center; color: #777; padding: 30px; font-size: 11px;">TODO COMPRADO</div>`;
                return;
            }

            shopGrid.innerHTML = personajesDisponibles.map(p => {
                const precio = p.precio || 100;
                return `
                <div class="card">
                    <div class="card-img" style="background-image: url('${p.imagen}');"></div>
                    <div class="card-text">
                        ID / ${p.id}<br>
                        RAREZA : ${p.rareza}<br>
                        #${p.categoria}
                    </div>
                    <button class="btn-card-action" onclick="comprarPersonaje('${p.id}')">COMPRAR ($${precio})</button>
                </div>
            `}).join('');
        }

        async function comprarPersonaje(personajeId) {
            const res = await fetch('/api/comprar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegramUser: usuarioActual, personajeId: personajeId })
            });
            const data = await res.json();
            if (data.success) {
                datosUsuario.saldo = data.nuevoSaldo;
                if (!datosUsuario.inventario) datosUsuario.inventario = [];
                datosUsuario.inventario.push(data.personaje);
                document.getElementById('user-balance').innerText = "$" + datosUsuario.saldo;
                renderInventario();
                renderTienda(); 
                alert(`¡Has comprado a ${data.personaje.id}!`);
            } else {
                alert(data.error);
            }
        }

        function dibujarRuletaCanvas(nombres) {
            const canvas = document.getElementById("wheel");
            if (!canvas) return;
            
            const size = 130;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = size * dpr;
            canvas.height = size * dpr;
            canvas.style.width = `${size}px`;
            canvas.style.height = `${size}px`;
            
            const ctx = canvas.getContext("2d");
            ctx.scale(dpr, dpr);

            const radio = size / 2;
            const centro = size / 2;
            const anguloSeccion = (2 * Math.PI) / nombres.length;

            ctx.clearRect(0, 0, size, size);

            nombres.forEach((nombre, i) => {
                const anguloInicio = i * anguloSeccion;
                const anguloFin = anguloInicio + anguloSeccion;

                ctx.beginPath();
                ctx.moveTo(centro, centro);
                ctx.arc(centro, centro, radio, anguloInicio, anguloFin);
                ctx.fillStyle = "#000";
                ctx.fill();
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = "#fff";
                ctx.stroke();

                ctx.save();
                ctx.translate(centro, centro);
                ctx.rotate(anguloInicio + anguloSeccion / 2);
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillStyle = "#fff";
                ctx.font = "10px monospace";
                
                let textoCorto = nombre.length > 9 ? nombre.substring(0, 8) + "." : nombre;
                ctx.fillText(textoCorto, radio - 8, 0);
                ctx.restore();
            });
        }

        let girando = false;
        async function girarRuleta() {
            if (girando) return;
            if (datosUsuario.saldo < 30) {
                logConsola("No tienes suficientes créditos (Necesitas 30).", "red");
                return;
            }

            girando = true;
            const wheel = document.getElementById('wheel');
            const randomDeg = Math.floor(1800 + Math.random() * 1080);
            wheel.style.transform = `rotate(${randomDeg}deg)`;
            logConsola("Girando ruleta gacha...", "yellow");

            try {
                const res = await fetch('/api/ruleta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramUser: usuarioActual })
                });
                const data = await res.json();

                setTimeout(() => {
                    girando = false;
                    if (data.success) {
                        datosUsuario.saldo = data.nuevoSaldo;
                        datosUsuario.inventario.push(data.personaje);
                        document.getElementById('user-balance').innerText = "$" + datosUsuario.saldo;
                        renderInventario();
                        renderTienda(); 
                        logConsola(`¡Ganaste en la ruleta a: ${data.personaje.id} (${data.personaje.rareza})!`, "#00ff66");
                    } else {
                        logConsola(data.error, "red");
                    }
                }, 3000);
            } catch (e) {
                girando = false;
                logConsola("Error de conexión al girar.", "red");
            }
        }

        async function reclamarDiario() {
            try {
                const res = await fetch('/api/diario', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramUser: usuarioActual })
                });
                const data = await res.json();
                if (data.success) {
                    datosUsuario.saldo = data.nuevoSaldo;
                    document.getElementById('user-balance').innerText = "$" + datosUsuario.saldo;
                    logConsola(data.mensaje, "#00ff66");
                }
            } catch (e) {
                logConsola("Error al reclamar diario.", "red");
            }
        }

        async function minarCreditos() {
            try {
                const res = await fetch('/api/minar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramUser: usuarioActual })
                });
                const data = await res.json();
                if (data.success) {
                    datosUsuario.saldo = data.nuevoSaldo;
                    document.getElementById('user-balance').innerText = "$" + datosUsuario.saldo;
                    logConsola(data.mensaje, "#00ff66");
                }
            } catch (e) {
                logConsola("Error al minar.", "red");
            }
        }

        async function ejecutarCrimen() {
            try {
                const res = await fetch('/api/crimen', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramUser: usuarioActual })
                });
                const data = await res.json();
                if (data.success) {
                    datosUsuario.saldo = data.nuevoSaldo;
                    document.getElementById('user-balance').innerText = "$" + datosUsuario.saldo;
                    const color = data.mensaje.includes("ÉXITO") ? "#00ff66" : "red";
                    logConsola(data.mensaje, color);
                }
            } catch (e) {
                logConsola("Error en el crimen.", "red");
            }
        }

        async function apostarCreditos() {
            const cantidad = document.getElementById('bet-amount').value;
            if (!cantidad || cantidad <= 0) {
                logConsola("Introduce una cantidad válida para apostar.", "red");
                return;
            }

            try {
                const res = await fetch('/api/apostar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramUser: usuarioActual, cantidad })
                });
                const data = await res.json();
                if (data.success) {
                    datosUsuario.saldo = data.nuevoSaldo;
                    document.getElementById('user-balance').innerText = "$" + datosUsuario.saldo;
                    const color = data.mensaje.includes("GANADA") ? "#00ff66" : "red";
                    logConsola(data.mensaje, color);
                } else {
                    logConsola(data.error, "red");
                }
            } catch (e) {
                logConsola("Error al procesar la apuesta.", "red");
            }
        }

        async function enviarATelegram(personaje) {
            const res = await fetch('/api/enviar-telegram', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegramUser: usuarioActual, personaje })
            });
            const data = await res.json();
            if (data.success) {
                alert("¡Personaje enviado al chat de Telegram con éxito!");
            } else {
                alert("Error al enviar: Asegúrate de configurar el Token del Bot en el servidor.");
            }
        }

        async function eliminarUsuario(telegramUser) {
            if (confirm(`¿Seguro que deseas eliminar la cuenta de @${telegramUser}?`)) {
                await fetch(`/api/admin/usuario/${telegramUser}`, { method: 'DELETE' });
                alert("Usuario eliminado de la base de datos.");
                procesarBusqueda();
            }
        }

        window.addEventListener('DOMContentLoaded', inicializar);
    </script>
</body>
</html>

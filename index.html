<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Gacha App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: monospace, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            border-bottom: 1px solid #ffffff;
        }

        .balance-box {
            border: 1px solid #ffffff;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            background: #000;
        }

        .search-box {
            border: 1px solid #ffffff;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            background: #000;
            color: #ffffff;
            text-align: right;
            width: 55%;
        }

        /* CONTENIDO PRINCIPAL */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: none;
        }

        .main-content.active {
            display: block;
        }

        /* INVENTARIO / GRILLA */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding-bottom: 20px;
        }

        .card {
            border: 1px solid #ffffff;
            padding: 10px;
            background: #000000;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card-img {
            width: 100%;
            height: 120px;
            border: 1px solid #ffffff;
            background: #111;
        }

        .card-text {
            font-size: 11px;
            line-height: 1.4;
        }

        /* RULETA (ALEATORIO) */
        .roulette-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 20px;
            text-align: center;
        }

        .roulette-wheel {
            width: 220px;
            height: 220px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #000;
        }

        .roulette-pointer {
            position: absolute;
            top: -10px;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 15px solid #ffffff;
        }

        .btn-action {
            border: 1px solid #ffffff;
            background: #000;
            color: #ffffff;
            padding: 12px 25px;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
        }

        .btn-action:active {
            background: #ffffff;
            color: #000000;
        }

        /* TIENDA */
        .shop-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .shop-item {
            border: 1px solid #ffffff;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #000;
        }

        /* NAVEGACIÓN INFERIOR */
        .nav-bar {
            display: flex;
            border-top: 1px solid #ffffff;
            background: #000000;
        }

        .nav-btn {
            flex: 1;
            padding: 15px 0;
            text-align: center;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            border-right: 1px solid #ffffff;
        }

        .nav-btn:last-child {
            border-right: none;
        }

        .nav-btn.active {
            background: #ffffff;
            color: #000000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- HEADER GENERAL -->
    <div class="header">
        <div class="balance-box" id="user-balance">$0</div>
        <div class="search-box">BUSCAR PERSONAJES</div>
    </div>

    <!-- SECCIÓN 1: INVENTARIO -->
    <div id="section-inventario" class="main-content active">
        <div class="grid">
            <div class="card">
                <div class="card-img"></div>
                <div class="card-text">
                    ID / here<br>
                    RAREZA : here<br>
                    #CATEGORIA
                </div>
            </div>
            <div class="card">
                <div class="card-img"></div>
                <div class="card-text">
                    ID / here<br>
                    RAREZA : here<br>
                    #CATEGORIA
                </div>
            </div>
            <div class="card">
                <div class="card-img"></div>
                <div class="card-text">
                    ID / here<br>
                    RAREZA : here<br>
                    #CATEGORIA
                </div>
            </div>
            <div class="card">
                <div class="card-img"></div>
                <div class="card-text">
                    ID / here<br>
                    RAREZA : here<br>
                    #CATEGORIA
                </div>
            </div>
        </div>
    </div>

    <!-- SECCIÓN 2: ALEATORIO (RULETA) -->
    <div id="section-aleatorio" class="main-content">
        <div class="roulette-container">
            <div class="roulette-wheel">
                <div class="roulette-pointer"></div>
                <span>[ RULETA ]</span>
            </div>
            <button class="btn-action" onclick="girarRuleta()">EJECUTAR TIRADA</button>
        </div>
    </div>

    <!-- SECCIÓN 3: TIENDA -->
    <div id="section-tienda" class="main-content">
        <div class="shop-list">
            <div class="shop-item">
                <div>
                    <strong>Pack x10 Créditos</strong><br>
                    <small>Recarga estándar</small>
                </div>
                <button class="btn-action" onclick="comprarItem()">COMPRAR</button>
            </div>
            <div class="shop-item">
                <div>
                    <strong>Cofre Especial</strong><br>
                    <small>Objeto aleatorio</small>
                </div>
                <button class="btn-action" onclick="comprarItem()">COMPRAR</button>
            </div>
        </div>
    </div>

    <!-- NAVEGACIÓN INFERIOR -->
    <div class="nav-bar">
        <button class="nav-btn active" onclick="cambiarSeccion('inventario', this)">Inventario</button>
        <button class="nav-btn" onclick="cambiarSeccion('aleatorio', this)">Aleatorio</button>
        <button class="nav-btn" onclick="cambiarSeccion('tienda', this)">Tienda</button>
    </div>

    <script>
        function cambiarSeccion(seccion, elemento) {
            // Ocultar todas las secciones
            document.querySelectorAll('.main-content').forEach(el => el.classList.remove('active'));
            // Quitar clase activa de los botones
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));

            // Mostrar la seleccionada
            document.getElementById('section-' + seccion).classList.add('active');
            elemento.classList.add('active');
        }

        function girarRuleta() {
            alert("¡Girando ruleta gacha!");
        }

        function comprarItem() {
            alert("Procesando compra...");
        }
    </script>
</body>
</html>

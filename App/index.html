<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPYCT // GACHA SYSTEM</title>
    <!-- Script oficial de Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #16181d;
            --accent-color: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.2);
            --text-main: #f0f0f3;
            --text-muted: #8b8e98;
            --border-color: #2a2e39;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace; /* Estética Tech / Terminal */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* BARRA SUPERIOR CON PESTAÑAS (ZONA DE BOTONES) */
        .nav-header {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: var(--card-bg);
            padding: 6px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 5px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
            text-align: center;
        }

        .nav-btn.active {
            background: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        /* CONTADOR DE MONEDAS */
        .user-stats {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .coins-display {
            color: var(--accent-color);
            font-weight: bold;
        }

        /* SECCIONES DE LA VISTA */
        .tab-content {
            display: none;
            flex: 1;
            flex-direction: column;
        }

        .tab-content.active {
            display: flex;
        }

        /* DISEÑO DE LA ZONA GACHA */
        .gacha-container {
            text-align: center;
            margin: auto 0;
            padding: 20px 0;
        }

        .gacha-screen {
            background: var(--card-bg);
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 30px 20px;
            margin-bottom: 20px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .pull-btn {
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--accent-glow);
            transition: transform 0.1s ease;
        }

        .pull-btn:active {
            transform: scale(0.98);
        }

        /* INVENTARIO / COLECCIÓN */
        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            overflow-y: auto;
            max-height: 60vh;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            text-align: left;
        }

        .item-card h4 {
            font-size: 13px;
            margin-bottom: 5px;
            color: var(--text-main);
        }

        .item-card p {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* MENSAJES DE ESTADO */
        .status-msg {
            margin-top: 10px;
            font-size: 12px;
            color: var(--accent-color);
            min-height: 15px;
        }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR: ZONA DE NAVEGACIÓN -->
    <div class="nav-header">
        <button class="nav-btn active" onclick="switchTab('gacha', event)">🎰 Gacha</button>
        <button class="nav-btn" onclick="switchTab('collection', event)">📦 Colección</button>
        <button class="nav-btn" onclick="switchTab('shop', event)">🛒 Tienda</button>
    </div>

    <!-- ESTADÍSTICAS RÁPIDAS -->
    <div class="user-stats">
        <span>ID: <span id="user-id" style="color:var(--text-muted)">Cargando...</span></span>
        <span>Créditos: <span id="user-coins" class="coins-display">0</span> 🪙</span>
    </div>

    <!-- CONTENIDO 1: ZONA DE GACHA -->
    <div id="tab-gacha" class="tab-content active">
        <div class="gacha-container">
            <div class="gacha-screen" id="gacha-result-box">
                <p style="color: var(--text-muted);">[ SISTEMA LISTO PARA TIRADA ]</p>
                <h3 id="result-name" style="margin-top: 10px; color: var(--accent-color);">Presiona el botón</h3>
            </div>
            <button class="pull-btn" onclick="realizarTirada()">Ejecutar Tirada (50 🪙)</button>
            <div class="status-msg" id="gacha-status"></div>
        </div>
    </div>

    <!-- CONTENIDO 2: ZONA DE COLECCIÓN -->
    <div id="tab-collection" class="tab-content">
        <h3 style="font-size: 14px; margin-bottom: 10px; text-transform: uppercase;">Inventario Activo</h3>
        <div class="inventory-grid" id="inventory-container">
            <!-- Los personajes se cargarán aquí dinámicamente -->
        </div>
    </div>

    <!-- CONTENIDO 3: ZONA DE TIENDA -->
    <div id="tab-shop" class="tab-content">
        <div style="background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; text-align: center;">
            <h3 style="font-size: 14px; margin-bottom: 10px;">Reclamo Diario</h3>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 15px;">Obtén fondos de emergencia para tus tiradas.</p>
            <button class="pull-btn" style="background: transparent; border: 1px solid var(--accent-color); color: var(--accent-color);" onclick="alert('Próximamente vinculado a NGL / Tareas')">Reclamar Monedas</button>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE TU BACKEND EN RENDER (YA CONFIGURADO)
        const API_URL = "https://telegram-gacha-app.onrender.com";

        // Obtener datos del usuario desde Telegram WebApp de forma segura
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Si se abre fuera de Telegram (en navegador de PC para pruebas), usa un ID de prueba por defecto
        const telegramId = (tg.initDataUnsafe && tg.initDataUnsafe.user) 
            ? tg.initDataUnsafe.user.id.toString() 
            : "usuario_prueba_123";

        document.getElementById('user-id').innerText = telegramId;

        // Variables de estado local
        let userData = { monedas: 0, personajes: [] };

        // Cambiar entre pestañas superiores
        function switchTab(tabName, event) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            event.currentTarget.classList.add('active');

            if(tabName === 'collection') {
                renderizarColeccion();
            }
        }

        // Cargar datos del usuario al iniciar la app
        async function cargarUsuario() {
            try {
                const response = await fetch(`${API_URL}/api/usuario/${telegramId}`);
                const data = await response.json();
                if (data.success) {
                    userData = data.data;
                    actualizarInterfaz();
                }
            } catch (error) {
                console.error("Error al conectar con el servidor:", error);
                document.getElementById('gacha-status').innerText = "⚠️ Error de conexión con la red.";
            }
        }

        function actualizarInterfaz() {
            document.getElementById('user-coins').innerText = userData.monedas;
        }

        // Ejecutar tirada de Gacha llamando a tu backend
        async function realizarTirada() {
            const statusEl = document.getElementById('gacha-status');
            const nameEl = document.getElementById('result-name');
            statusEl.innerText = "Procesando conexión con el nodo...";

            try {
                const response = await fetch(`${API_URL}/api/gacha`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ telegramId })
                });

                const data = await response.json();

                if (data.success) {
                    userData.monedas = data.monedasRestantes;
                    userData.personajes = data.inventario;
                    actualizarInterfaz();

                    nameEl.innerHTML = `✨ ¡Obteniste!<br><strong style="color:#fff; font-size: 16px;">${data.personaje.nombre}</strong><br><span style="font-size:11px; color:var(--text-muted)">[${data.personaje.rareza}]</span>`;
                    statusEl.innerText = "¡Tirada exitosa registrada en la nube!";
                } else {
                    statusEl.innerText = "❌ " + data.error;
                }
            } catch (error) {
                console.error(error);
                statusEl.innerText = "❌ Error crítico al procesar la tirada.";
            }
        }

        // Mostrar inventario en la pestaña de colección
        function renderizarColeccion() {
            const container = document.getElementById('inventory-container');
            container.innerHTML = "";

            if (!userData.personajes || userData.personajes.length === 0) {
                container.innerHTML = `<p style="grid-column: span 2; color: var(--text-muted); text-align:center; padding: 20px;">Sin registros en el inventario.</p>`;
                return;
            }

            userData.personajes.forEach(p => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <h4>${p.nombre}</h4>
                    <p>Rareza: ${p.rareza}</p>
                    <p style="font-size:9px; margin-top:5px; color:var(--text-muted);">${p.tipo || 'Operativo'}</p>
                `;
                container.appendChild(card);
            });
        }

        // Inicializar carga de datos al abrir
        cargarUsuario();
    </script>
</body>
</html>
